name: Browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match the project's locked Playwright version; browsers and OS dependencies
    # are already installed, avoiding a slow apt mirror before tests can run.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui:types
      - run: npm run build
      - name: Require nonzero UI-only discovery in both browser projects
        run: npm run test:browser:discovery
      - name: Run UI-only screen checks (no gameplay)
        run: npm run test:browser
      - name: Preserve UI results, screenshots, traces and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-only-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
