<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#071e2b" />
    <meta
      name="description"
      content="味方50機と10隻で、浮遊島に現れた敵100人を撃破する。"
    />
    <title>ウチオトセ</title>
  </head>
  <body>
    <main id="app" data-screen="home" data-mode="easy">
      <section id="home" class="screen home-screen" aria-labelledby="title">
        <div class="brand-line">
          <span class="brand-mark" aria-hidden="true">U</span>
          <span>AIR &amp; ISLAND DEFENSE</span>
          <span class="version">開発中</span>
        </div>
        <div class="home-copy">
          <p class="eyebrow">浮遊島からの迎撃作戦</p>
          <h1 id="title">ウチオトセ</h1>
          <p class="intro">
            浮遊島に現れた飛行戦士を、<br />味方の飛行隊と艦隊で迎え撃つ。
          </p>
        </div>
        <div class="briefing">
          <div class="mission-data" aria-label="作戦戦力">
            <div>
              <span>味方航空隊</span>
              <strong>50<small>機</small></strong>
              <em>総残機</em>
            </div>
            <div>
              <span>敵の飛行戦士</span>
              <strong>100<small>人</small></strong>
              <em>有限の敵戦力</em>
            </div>
            <div>
              <span>味方艦隊</span>
              <strong>10<small>隻</small></strong>
              <em>作戦全艦</em>
            </div>
          </div>
          <fieldset class="mode-picker">
            <legend>操作モード</legend>
            <label>
              <input type="radio" name="game-mode" value="easy" checked />
              <span>イージー</span>
            </label>
            <label>
              <input type="radio" name="game-mode" value="normal" />
              <span>ノーマル</span>
            </label>
          </fieldset>
          <button id="start" class="primary" type="button" disabled>
            作戦開始は準備中です
          </button>
          <p id="p1-status" class="controls-guide" role="status">
            開発中のため、まだ出撃できません。
          </p>
        </div>
        <footer class="home-footer">
          <span>UCHIOTOSE / ウチオトセ</span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
